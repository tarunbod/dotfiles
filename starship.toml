"$schema" = 'https://starship.rs/config-schema.json'

format = """
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$time\n\
[󱞪](fg:white) \
"""

palette = "charcoal-atelier"

# Colors from charcoal-atelier.json.
[palettes.charcoal-atelier]
background = '#161616'
surface = '#262626'
text = '#d6d2cc'
white = '#efece7'
accent = '#e05d3a'
red = '#d96a4d'
sage = '#9aab84'
sand = '#cfae7a'
blue = '#8aa0b4'
mauve = '#b193a8'
teal = '#8fafa8'

[hostname]
disabled = false
format = "[](fg:accent)[ $hostname ]($style)[](fg:accent) "
style = "bg:accent fg:background"

[directory]
format = "[](fg:surface)[ $path ]($style)[](fg:surface) "
style = "bg:surface fg:blue"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

[fill]
style = "fg:surface"
symbol = " "

[git_branch]
format = "[](fg:surface)[ $symbol $branch ]($style)[](fg:surface) "
style = "bg:surface fg:teal"
symbol = ""

[git_status]
disabled = false
style = "bg:surface fg:red"
format = '[](fg:surface)([$all_status$ahead_behind]($style))[](fg:surface) '
up_to_date = '[ ✓ ](bg:surface fg:sage)'
untracked = '[?\($count\)](bg:surface fg:sand)'
stashed = '[\$](bg:surface fg:mauve)'
modified = '[!\($count\)](bg:surface fg:sand)'
renamed = '[»\($count\)](bg:surface fg:mauve)'
deleted = '[✘\($count\)](bg:surface fg:red)'
staged = '[++\($count\)](bg:surface fg:sage)'
ahead = '[⇡\(${count}\)](bg:surface fg:teal)'
diverged = '⇕[\[](bg:surface fg:mauve)[⇡\(${ahead_count}\)](bg:surface fg:teal)[⇣\(${behind_count}\)](bg:surface fg:blue)[\]](bg:surface fg:mauve)'
behind = '[⇣\(${count}\)](bg:surface fg:blue)'

[time]
disabled = false
format = " [](fg:surface)[ $time 󰥔 ]($style)[](fg:surface)"
style = "bg:surface fg:text"
time_format = "%T"

[username]
disabled = false
format = "[](fg:surface)[ 󰧱 $user ]($style)[](fg:surface) "
show_always = true
style_root = "bg:surface fg:mauve"
style_user = "bg:surface fg:mauve"
